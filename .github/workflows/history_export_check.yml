name: History Export Check

on:
  push:
    branches:
      - analysis/history-export

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile exporter
        run: python -m py_compile fb_history_export.py fb_config.py

      - name: Import exporter without running Meta calls
        run: python -c "import fb_history_export; print('import ok')"
