name: FB Ads Manager Auto-Checker

on:
  workflow_dispatch:


permissions:
  contents: write

concurrency:
  group: fb-manager
  cancel-in-progress: false

jobs:
  run-fb-manager:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Run FB Manager Script
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          META_GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1" # <--- ПРИМУСОВИЙ МИТТЄВИЙ ВИВІД ЛОГІВ
        run: timeout 6m python fb_manager.py

      - name: Alert on workflow failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -sS -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
              --data-urlencode "text=⚠️ FB Manager workflow зупинено через помилку або timeout. GitHub Actions run: $GITHUB_RUN_ID" >/dev/null || true
          fi
