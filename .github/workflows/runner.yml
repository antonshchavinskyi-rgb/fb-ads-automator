name: FB Ads Manager Auto-Checker

on:
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:

jobs:
  run-fb-manager:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run FB Manager Script
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          PYTHONUNBUFFERED: "1" # <--- ПРИМУСОВИЙ МИТТЄВИЙ ВИВІД ЛОГІВ
        run: python fb_manager.py
