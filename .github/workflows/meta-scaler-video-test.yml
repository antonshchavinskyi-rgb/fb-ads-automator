name: Upload one local video to Meta Ads
on:
  push:
    branches: [codex/meta-scaler-video-test-1567]
    paths: [.github/workflows/meta-scaler-video-test.yml]
permissions:
  contents: read
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Receive and verify the sealed MP4
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import os
          import subprocess
          import time
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          work = Path(os.environ["RUNNER_TEMP"])
          private = work / "video-transfer.pem"
          subprocess.run(["openssl", "genpkey", "-algorithm", "RSA", "-pkeyopt", "rsa_keygen_bits:3072", "-out", str(private)], check=True, stderr=subprocess.DEVNULL)
          public = subprocess.check_output(["openssl", "pkey", "-in", str(private), "-pubout", "-outform", "DER"])
          print("TRANSFER_PUBLIC_KEY=" + base64.b64encode(public).decode(), flush=True)

          repo = os.environ["GITHUB_REPOSITORY"]
          ref = os.environ["GITHUB_REF_NAME"]
          def receive(name):
              url = f"https://api.github.com/repos/{repo}/contents/.sealed-video/{name}?" + urlencode({"ref": ref})
              request = Request(url, headers={
                  "Accept": "application/vnd.github.raw+json",
                  "Authorization": "Bearer " + os.environ["GH_READ_TOKEN"],
              })
              with urlopen(request, timeout=15) as response:
                  return response.read()

          deadline = time.monotonic() + 600
          while True:
              try:
                  marker = receive("complete")
                  if marker != b"meta-video-1567-sealed-v1":
                      raise SystemExit("Unexpected transfer marker.")
                  break
              except HTTPError as error:
                  if error.code != 404:
                      raise
              if time.monotonic() >= deadline:
                  raise SystemExit("No encrypted video received.")
              time.sleep(5)

          envelope = work / "sealed-video.key"
          envelope.write_bytes(receive("key.bin"))
          key_iv = subprocess.check_output([
              "openssl", "pkeyutl", "-decrypt", "-inkey", str(private),
              "-in", str(envelope), "-pkeyopt", "rsa_padding_mode:oaep",
              "-pkeyopt", "rsa_oaep_md:sha256",
          ])
          private.unlink()
          if len(key_iv) != 48:
              raise SystemExit("Invalid transfer key.")
          ciphertext = work / "sealed-video.bin"
          ciphertext.write_bytes(b"".join(receive(f"{i:02}.bin") for i in range(9)))
          video = work / "meta-video-test.mp4"
          subprocess.run([
              "openssl", "enc", "-d", "-aes-256-ctr", "-in", str(ciphertext),
              "-out", str(video), "-K", key_iv[:32].hex(), "-iv", key_iv[32:].hex(),
          ], check=True)
          digest = hashlib.file_digest(video.open("rb"), "sha256").hexdigest()
          if digest != "a57cb2fb21266d37b056d8ba84ab21037d3199f3ceb1dbbf638b3913adbd2e02":
              video.unlink()
              raise SystemExit("MP4 integrity check failed.")
          print("LOCAL_MP4_VERIFIED", flush=True)
          PY
      - name: Upload the verified MP4 using the scaler access
        env:
          META_TOKEN: ${{ secrets.FB_SCALER_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import time
          from pathlib import Path

          token = os.environ.get("META_TOKEN")
          if not token:
              raise SystemExit("FB_SCALER_ACCESS_TOKEN is unavailable.")
          video = Path(os.environ["RUNNER_TEMP"]) / "meta-video-test.mp4"
          filename = "1567-2026-11-13_meta-1642160670297957_41-сек.mp4"
          def meta(url, *args):
              result = subprocess.run(
                  ["curl", "--silent", "--show-error", "--max-time", "90",
                   "--config", "-", *args, url],
                  input=f'header = "Authorization: Bearer {token}"\n',
                  capture_output=True, text=True, check=False,
              )
              if result.returncode:
                  raise SystemExit(f"Meta transport failed ({result.returncode}).")
              value = json.loads(result.stdout)
              if value.get("error"):
                  error = value["error"]
                  message = (error.get("message") or "").replace(token, "[redacted]")
                  raise SystemExit(f"Meta API code={error.get('code')} subcode={error.get('error_subcode')}: {message}")
              return value
          try:
              result = meta(
                  "https://graph-video.facebook.com/v25.0/act_1732457457319086/advideos",
                  "--form-string", f"name={filename[:-4]}",
                  "--form", f"source=@{video};type=video/mp4;filename={filename}",
              )
              video_id = str(result.get("id") or result.get("video_id") or "")
              if not video_id.isdigit():
                  raise SystemExit("Upload response did not include a video ID.")
              print(f"META_VIDEO_ID={video_id}", flush=True)
              deadline = time.monotonic() + 180
              while True:
                  result = meta(f"https://graph.facebook.com/v25.0/{video_id}?fields=status")
                  status = result.get("status", {}).get("video_status", "unknown")
                  if status == "ready":
                      print("META_VIDEO_STATUS=ready", flush=True)
                      break
                  if status in {"error", "failed"} or time.monotonic() >= deadline:
                      raise SystemExit(f"META_VIDEO_STATUS={status}")
                  time.sleep(5)
          finally:
              video.unlink(missing_ok=True)
          PY
