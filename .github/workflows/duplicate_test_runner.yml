name: FB Creative Compare v20 — READ ONLY

on:
  workflow_dispatch:
    inputs:
      source_ad_id:
        description: 'Working original/source Ad ID'
        required: true
        type: string
      fixed_ad_id:
        description: 'Clone Ad ID AFTER manual thumbnail fix + successful publish'
        required: true
        type: string
      broken_ad_id:
        description: 'Optional: broken clone Ad ID with #2643026'
        required: false
        type: string

jobs:
  creative-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run tolerant READ ONLY creative compare v20
        env:
          FB_SCALER_ACCESS_TOKEN: ${{ secrets.FB_SCALER_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOURCE_AD_ID: ${{ inputs.source_ad_id }}
          FIXED_AD_ID: ${{ inputs.fixed_ad_id }}
          BROKEN_AD_ID: ${{ inputs.broken_ad_id }}
        run: python fb_duplicate_test.py

      - name: Upload compare report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creative-compare-v20-report
          path: duplicate_test_v20_compare_report.json
          if-no-files-found: ignore
