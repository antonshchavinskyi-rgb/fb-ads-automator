name: FB Duplicate Test — Ordinary Ads v6 Compatibility

on:
  workflow_dispatch:
    inputs:
      adset_id:
        description: 'ONE ordinary adset ID. Native deep-copy first; legacy 3858504 falls back to a NEW creative compatibility clone. Everything PAUSED.'
        required: true
        type: string

jobs:
  duplicate-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run ordinary duplicate compatibility test v6
        env:
          FB_SCALER_ACCESS_TOKEN: ${{ secrets.FB_SCALER_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DUPLICATE_TEST_ADSET_IDS: ${{ inputs.adset_id }}
        run: python fb_duplicate_test.py

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fb-duplicate-test-v6-compat-report
          path: duplicate_test_v6_compat_report.json
          if-no-files-found: ignore
