name: FB Duplicate Test — Ordinary Ads v4

on:
  workflow_dispatch:
    inputs:
      adset_ids:
        description: 'Ordinary adset IDs only, comma/space separated (max 5). Catalogs are skipped. Creates PAUSED deep copies.'
        required: true
        type: string

jobs:
  duplicate-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run ordinary duplicate test v4
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DUPLICATE_TEST_ADSET_IDS: ${{ inputs.adset_ids }}
        run: python fb_duplicate_test.py

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fb-duplicate-test-ordinary-v4-report
          path: duplicate_test_ordinary_report.json
          if-no-files-found: ignore
