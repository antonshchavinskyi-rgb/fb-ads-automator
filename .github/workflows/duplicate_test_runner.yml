name: FB Creative Compare v21 — READ ONLY by Adset

on:
  workflow_dispatch:
    inputs:
      source_adset_id:
        description: 'Working original/source Adset ID'
        required: true
        type: string
      fixed_adset_id:
        description: 'Clone Adset ID whose ad was manually fixed + successfully published'
        required: true
        type: string
      broken_adset_id:
        description: 'Optional: clone Adset ID whose ad still has #2643026'
        required: false
        type: string

jobs:
  creative-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run READ ONLY creative compare v21 by Adset
        env:
          FB_SCALER_ACCESS_TOKEN: ${{ secrets.FB_SCALER_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOURCE_ADSET_ID: ${{ inputs.source_adset_id }}
          FIXED_ADSET_ID: ${{ inputs.fixed_adset_id }}
          BROKEN_ADSET_ID: ${{ inputs.broken_adset_id }}
        run: python fb_duplicate_test.py

      - name: Upload compare report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creative-compare-v21-report
          path: duplicate_test_v21_compare_by_adset_report.json
          if-no-files-found: ignore
