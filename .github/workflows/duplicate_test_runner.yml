name: FB Duplicate Test — Stable Runner

on:
  workflow_dispatch:
    inputs:
      adset_id:
        description: 'ONE Adset ID to test'
        required: true
        type: string

jobs:
  duplicate-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run duplicate test
        env:
          FB_SCALER_ACCESS_TOKEN: ${{ secrets.FB_SCALER_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_ADSET_ID: ${{ inputs.adset_id }}
        run: python fb_duplicate_test.py

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duplicate-test-report
          path: duplicate_test_*_report.json
          if-no-files-found: ignore
