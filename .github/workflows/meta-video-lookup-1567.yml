                      key = digest(row["id"])
                      if wanted is None or key in wanted:
                          saved[key] = row
                  if wanted is not None and set(saved) == wanted:
                      return saved
                  paging = reply.get("paging", {})
                  cursor = paging.get("cursors", {}).get("after")
                  if not paging.get("next"):
                      return saved
                  if not cursor or cursor == query.get("after"):
                      raise MetaError("PAGINATION_STALLED")
                  query["after"] = cursor
              if wanted is None:
                  raise MetaError("PAGINATION_INCOMPLETE")
              return saved
          
          def node(identifier, fields):
              return graph_call(str(identifier), {"fields": fields})
          
          def ad_post(ad):
              return (ad.get("creative") or {}).get("effective_object_story_id")
          
          def verify_group(value, destination, expected_status="PAUSED"):
              return (
                  str(value.get("campaign_id")) == destination
                  and value.get("configured_status") == expected_status
                  and str(value.get("daily_budget")) == budget
                  and str(value.get("bid_amount")) == bid
                  and value.get("bid_strategy") == strategy
                  and bool(value.get("start_time"))
                  and datetime.fromisoformat(value["start_time"]) == start
              )
          
          def batch_activate(ids):
              for offset in range(0, len(ids), 25):
                  chunk = ids[offset:offset+25]
                  ops = [{"method": "POST", "relative_url": identifier, "body": "status=ACTIVE"} for identifier in chunk]
                  try:
                      response = graph_call("", form={"batch": json.dumps(ops)})
                  except RateLimited:
                      raise
                  except (MetaError, OSError, ValueError):
                      response = None
                  if isinstance(response, list) and len(response) == len(ops):
                      for item in response:
                          if isinstance(item, dict) and item.get("code") != 200:
                              try:
                                  failure = json.loads(item.get("body") or "{}").get("error") or {}
                              except (ValueError, AttributeError, TypeError):
                                  continue
                              if failure.get("code") in (4, 17, 32, 613, 80000, 80001, 80002, 80003, 80004, 80005) or item.get("code") == 429:
                                  raise RateLimited(300)
                      failed = [identifier for identifier, item in zip(chunk, response) if not isinstance(item, dict) or item.get("code") != 200]
                  else:
                      failed = chunk
                  for identifier in failed:
                      state = node(identifier, "configured_status").get("configured_status")
                      if state == "ACTIVE":
                          continue
                      if state != "PAUSED":
                          raise MetaError("ACTIVATION_OBJECT_NOT_PAUSED")
                      graph_call(identifier, form={"status": "ACTIVE"})
          
          def activate():
              if datetime.now(timezone.utc) >= start:
                  raise SystemExit("BID_ACTIVATION_ERROR=START_NOT_FUTURE")
              source_names = ("", " — спільний пост", " — окремий пост")
              try:
                  phase = "scope"
                  target_id = str(paged(account + "/campaigns", "id", {plan["campaign"]})[plan["campaign"]]["id"])
                  target = node(target_id, campaign_fields)
                  if target.get("configured_status") not in ("PAUSED", "ACTIVE") or target.get("objective") != "OUTCOME_LEADS" or int(target.get("daily_budget") or 0) or int(target.get("lifetime_budget") or 0):
                      raise MetaError("CAMPAIGN_INVALID")
                  source_groups = paged(account + "/adsets", "id,name", {r[0] for r in plan["clips"]})
                  source_ads = paged(account + "/ads", ad_fields, {r[1] for r in plan["clips"]})
                  groups = list(paged(target_id + "/adsets", group_fields).values())
                  named = {g["name"]: g for g in groups}
                  if len(groups) != 27 or len(named) != 27 or len(source_groups) != 9 or len(source_ads) != 9:
                      raise MetaError("WRONG_SCOPE_COUNT")
                  pairs = []
                  pending_groups, pending_ads = [], []
                  phase = "validate"
                  for source in plan["clips"]:
                      if str(source_ads[source[1]].get("adset_id")) != str(source_groups[source[0]]["id"]):
                          raise MetaError("SOURCE_SCOPE_INVALID")
                      post = ad_post(source_ads[source[1]])
                      root_name = source_groups[source[0]]["name"].removesuffix("кос") + "бід"
                      for role, suffix in enumerate(source_names):
                          group = named.get(root_name + suffix, {})
                          status = group.get("configured_status")
                          if status not in ("PAUSED", "ACTIVE") or not verify_group(group, target_id, status):
                              raise MetaError("GROUP_SCHEDULE_OR_BID_INVALID")
                          gid = str(group["id"])
                          ads = graph_call(gid + "/ads", {"fields": ad_fields, "limit": 2})
                          if len(ads.get("data", [])) != 1 or ads.get("paging", {}).get("next"):
                              raise MetaError("GROUP_AD_COUNT_INVALID")
                          ad = ads["data"][0]
                          adstatus = ad.get("configured_status")
                          if adstatus not in ("PAUSED", "ACTIVE") or not post or not ad_post(ad) or str(ad.get("adset_id")) != gid:
                              raise MetaError("AD_OR_POST_INVALID")
                          if (ad_post(ad) == post) != (role in (0, 1)):
                              raise MetaError("WRONG_POST_ID")
                          if ad.get("effective_status") in ("DISAPPROVED", "WITH_ISSUES"):
                              raise MetaError("AD_REJECTED")
                          aid = str(ad["id"])
                          pairs.append((gid, aid))
                          if status == "PAUSED":
                              pending_groups.append(gid)
                          if adstatus == "PAUSED":
                              pending_ads.append(aid)
                  if target.get("configured_status") == "ACTIVE" and (pending_ads or pending_groups):
                      raise MetaError("PARTIALLY_ACTIVE_CAMPAIGN")
          
                  phase = "activate_ads"
                  batch_activate(pending_ads)
                  phase = "activate_groups"
                  batch_activate(pending_groups)
                  phase = "verify_children"
                  after = list(paged(target_id + "/adsets", group_fields).values())
                  if len(after) != 27 or not all(verify_group(g, target_id, "ACTIVE") for g in after):
                      raise MetaError("GROUP_FINAL_STATUS_INVALID")
                  expected_ads = {digest(ad_id) for _, ad_id in pairs}
                  final_ads = paged(target_id + "/ads", ad_fields, expected_ads)
                  if len(final_ads) != 27 or any(ad.get("configured_status") != "ACTIVE" for ad in final_ads.values()):
                      raise MetaError("ADS_FINAL_STATUS_INVALID")
                  if any(ad.get("effective_status") in ("DISAPPROVED", "WITH_ISSUES") for ad in final_ads.values()):
                      raise MetaError("ADS_REJECTED_AFTER_ACTIVATION")
                  phase = "activate_campaign"
                  if datetime.now(timezone.utc) >= start:
                      raise MetaError("START_NOT_FUTURE")
                  if target.get("configured_status") == "PAUSED":
                      graph_call(target_id, form={"status": "ACTIVE"})
                  if node(target_id, campaign_fields).get("configured_status") != "ACTIVE":
                      raise MetaError("CAMPAIGN_FINAL_STATUS_INVALID")
                  print("BID_SCHEDULE_VERIFIED groups=27 ads=27 same_posts=18 separate_posts=9 active_campaign=True warsaw=2026-11-17T05:42:00+01:00", flush=True)
              except RateLimited:
                  raise
              except (MetaError, KeyError) as error:
                  raise SystemExit(f"BID_ACTIVATION_ERROR={phase}_{str(error)}")
              except Exception:
                  raise SystemExit(f"BID_ACTIVATION_ERROR={phase}_REQUEST_FAILED")
          
          
          deadline = time.monotonic() + 2800
          while True:
              try:
                  activate()
                  break
              except RateLimited as error:
                  delay = error.delay
                  if time.monotonic() + delay >= deadline or (start - datetime.now(timezone.utc)).total_seconds() < delay + 300:
                      raise SystemExit("BID_ACTIVATION_ERROR=RATE_LIMIT_WINDOW")
                  print(f"BID_COOLDOWN stage=activation seconds={delay}", flush=True)
                  time.sleep(delay)
          PY
