name: Recheck Meta creative folder access with scaler
on:
  push:
    branches: [codex/meta-video-lookup-20261116]
    paths: [.github/workflows/meta-video-lookup-1567.yml]
permissions: {}
jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read creative folder and video access
        env:
          META_ACCESS_TOKEN: ${{ secrets.FB_SCALER_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          token = os.environ["META_ACCESS_TOKEN"]
          if not token:
              raise SystemExit("Scaler secret is unavailable.")
          account = "act_1732457457319086"
          expected = {
              "1121570050694411", "1521290343162951", "1635063941431588",
              "1642160670297957", "1766520411070794", "1785101992719160",
              "1837989767473642", "1934340758012535", "1552400246633057",
          }

          def read(version, path, label, **params):
              url = f"https://graph.facebook.com/{version}/{path}?" + urlencode(params)
              req = Request(url, headers={"Authorization": f"Bearer {token}"})
              try:
                  with urlopen(req, timeout=12) as res:
                      return json.load(res)
              except HTTPError as error:
                  detail = json.load(error).get("error", {})
                  message = (detail.get("message") or "").replace(token, "[redacted]")
                  known = {
                      "Tried accessing nonexisting field": "field_unavailable",
                      "Permissions error": "permission_denied",
                      "Unsupported get request": "object_or_edge_unavailable",
                      "application does not have permission": "app_permission_denied",
                  }
                  note = next((tag for prefix, tag in known.items() if prefix.lower() in message.lower()), "other")
                  print(f"PROBE {version} {label} HTTP={error.code} code={detail.get('code')} subcode={detail.get('error_subcode')} reason={note}", flush=True)
                  return None

          def list_rows(version, path, label, fields=None, max_pages=12):
              query = {"limit": 100}
              if fields:
                  query["fields"] = fields
              rows = []
              complete = False
              for _ in range(max_pages):
                  result = read(version, path, label, **query)
                  if result is None:
                      return None
                  rows.extend(result.get("data", []))
                  paging = result.get("paging", {})
                  after = paging.get("cursors", {}).get("after")
                  if not paging.get("next"):
                      complete = True
                      break
                  if not after or after == query.get("after"):
                      break
                  query["after"] = after
              print(f"PROBE {version} {label} rows={len(rows)} complete={complete}", flush=True)
              return rows

          def video_matches(rows):
              matched = set()
              for row in rows:
                  title = " ".join(str(row.get(key) or "") for key in ("name", "title", "filename"))
                  matched.update(key for key in expected if key in title)
              return len(matched)

          identity = read("v25.0", "me", "identity", fields="id,name") or {}
          print(f"PROBE scaler_identity_matches={identity.get('id') == '61593290271041' or identity.get('name') == 'for_scaler'}", flush=True)
          permissions = list_rows("v25.0", "me/permissions", "token-permissions")
          if permissions is not None:
              granted = {entry.get("permission") for entry in permissions if entry.get("status") == "granted"}
              print(f"PROBE token_business_creative_management={'business_creative_management' in granted} token_ads_management={'ads_management' in granted}", flush=True)

          ad_account = read("v25.0", account, "account", fields="business{id,name}") or {}
          owner = ad_account.get("business") or {}
          businesses = {owner["id"]: owner} if owner.get("id") else {}
          available = list_rows("v25.0", "me/businesses", "business-list", "id,name") or []
          for item in available:
              if "soulpath" in (item.get("name") or "").replace(" ", "").casefold():
                  businesses[item["id"]] = item
          print(f"PROBE account_business_resolved={bool(owner.get('id'))} owner_name_matches_soulpath={'soulpath' in (owner.get('name') or '').replace(' ', '').casefold()} business_candidates={len(businesses)}", flush=True)

          for version in ("v25.0", "v26.0", "v27.0"):
              for index, business_id in enumerate(businesses, 1):
                  mark = f"business-{index}"
                  folders = list_rows(version, business_id + "/creative_folders", mark + "-folders", "id,name")
                  if folders is not None:
                      matches = [folder for folder in folders if folder.get("name", "").strip() == "1567"]
                      for folder in folders:
                          if "soulpath" in folder.get("name", "").replace(" ", "").casefold():
                              children = list_rows(version, folder["id"] + "/subfolders", mark + "-soulpath-subfolders", "id,name") or []
                              matches.extend(child for child in children if child.get("name", "").strip() == "1567")
                      print(f"PROBE {version} {mark} offer_1567_folders={len(matches)}", flush=True)
                      for match in matches:
                          detail = read(version, match["id"], "folder-1567-details", fields="id,name")
                          print(f"PROBE {version} folder_1567_readable={bool(detail and detail.get('id'))}", flush=True)
                  creatives = list_rows(version, business_id + "/creatives", mark + "-creatives")
                  if creatives is not None:
                      print(f"PROBE {version} {mark} matching_filenames={video_matches(creatives)}", flush=True)

          videos = list_rows("v25.0", account + "/advideos", "ad-account-videos", "id,title,created_time", max_pages=40)
          if videos is not None:
              print(f"PROBE ad_account_matching_filenames={video_matches(videos)}", flush=True)
          PY
