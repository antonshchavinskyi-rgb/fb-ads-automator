name: Meta video lookup for offer 1567
on:
  push:
    branches: [codex/meta-video-lookup-20261116]
    paths: [.github/workflows/meta-video-lookup-1567.yml]
permissions: {}
jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read ad account videos from Meta
        env:
          META_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          token = os.environ["META_ACCESS_TOKEN"]
          account = "act_1732457457319086"
          marker = "1766520411070794"

          def read(path, label, **params):
              url = "https://graph.facebook.com/v25.0/" + path + "?" + urlencode(params)
              request = Request(url, headers={"Authorization": f"Bearer {token}"})
              try:
                  with urlopen(request, timeout=12) as response:
                      return json.load(response)
              except HTTPError as error:
                  details = json.load(error).get("error", {})
                  message = (details.get("message") or "").replace(token, "[redacted]")
                  print(f"ERROR {label} HTTP={error.code} code={details.get('code')} subcode={details.get('error_subcode')} message={message[:220]}", flush=True)
                  return {}

          def rows(path, label, fields=None, max_pages=10):
              params = {"limit": 100}
              if fields:
                  params["fields"] = fields
              count = 0
              for page in range(max_pages):
                  result = read(path, label, **params)
                  if not result:
                      break
                  data = result.get("data", [])
                  count += len(data)
                  yield from data
                  paging = result.get("paging", {})
                  after = paging.get("cursors", {}).get("after")
                  if not paging.get("next") or not after or after == params.get("after"):
                      break
                  params["after"] = after
              print(f"CHECK {label} rows={count}", flush=True)

          control = "1869310394502322"
          account_videos = list(rows(account + "/advideos", "account-videos", "id,title,created_time"))
          print(f"CONTROL account_contains_known_ad_video={any(row.get('id') == control for row in account_videos)}", flush=True)

          owner = read(account, "account-business", fields="business{id,name}").get("business") or {}
          businesses = {owner["id"]: owner} if owner.get("id") else {}
          for item in rows("me/businesses", "available-businesses", "id,name"):
              if "soulpath" in (item.get("name") or "").replace(" ", "").casefold():
                  businesses[item["id"]] = item
          print(f"BUSINESS candidates={len(businesses)}", flush=True)

          def is_offer(item):
              title = " ".join(str(item.get(key) or "") for key in ("name", "title", "filename"))
              return "1567" in title or marker in title

          def show(item, label):
              keys = ("id", "name", "title", "filename", "business_video_id", "video_id")
              payload = {k: item[k] for k in keys if isinstance(item.get(k), (str, int))}
              print(f"MATCH {label} {json.dumps(payload)}", flush=True)

          for business_id in businesses:
              for folder in rows(business_id + "/creative_folders", "business-folders", "id,name"):
                  name = folder.get("name") or ""
                  if is_offer(folder) or name.replace(" ", "").casefold() == "soulpath":
                      show(folder, "folder")
                      for child in rows(folder["id"] + "/subfolders", "subfolders", "id,name"):
                          if is_offer(child):
                              show(child, "subfolder")
              for asset in rows(business_id + "/creatives", "business-creatives", max_pages=16):
                  if is_offer(asset):
                      show(asset, "business-creative")
          PY
