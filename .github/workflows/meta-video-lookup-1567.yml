name: Compare publication identity for two Meta ads
on:
  push:
    branches: [codex/meta-video-lookup-20261116]
    paths: [.github/workflows/meta-video-lookup-1567.yml]
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read and compare publication identity
        env:
          META_ACCESS_TOKEN: ${{ secrets.FB_SCALER_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          wanted = set(["e4ae8be409de47160599f68c59c64844cdbc6a6ca6421476fbd16ce1cf7d63f1","853055a3a472b80c4860c161b8449e05287638393eacb8a565d0c47b0fbd48df"])
          graph = "https://graph.facebook.com/v25.0/"
          account = "act_1732457457319086"
          token = os.environ["META_ACCESS_TOKEN"]

          def read(path, **query):
              request = Request(graph + path + "?" + urlencode(query), headers={"Authorization": "Bearer " + token})
              with urlopen(request, timeout=12) as response:
                  return json.load(response)

          def compare():
              matches = {}
              query = {"fields": "id", "limit": 250}
              for _ in range(35):
                  page = read(account + "/ads", **query)
                  for row in page.get("data", []):
                      ad_id = str(row["id"])
                      digest = hashlib.sha256(ad_id.encode("ascii")).hexdigest()
                      if digest in wanted:
                          matches[digest] = ad_id
                  if len(matches) == len(wanted):
                      break
                  paging = page.get("paging", {})
                  cursor = paging.get("cursors", {}).get("after")
                  if not paging.get("next") or not cursor or cursor == query.get("after"):
                      break
                  query["after"] = cursor

              if len(matches) != len(wanted):
                  return "AD_NOT_FOUND"
              ads = [read(ad_id, fields="creative{effective_object_story_id}") for ad_id in matches.values()]
              post_ids = [(ad.get("creative") or {}).get("effective_object_story_id") for ad in ads]
              if not all(post_ids):
                  return "POST_NOT_AVAILABLE"
              return "SAME" if post_ids[0] == post_ids[1] else "DIFFERENT"

          try:
              result = compare()
          except Exception:
              result = "REQUEST_FAILED"
          print("POST_COMPARISON_RESULT=" + result)
          PY
